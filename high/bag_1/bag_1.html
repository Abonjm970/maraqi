<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحقيبة الأولى — المرحلة الثانوية — مكتبة مراقي المعرفة</title>
  <meta name="description" content="كتب الحقيبة الأولى من مكتبة المرحلة الثانوية في برنامج مكتبة مراقي المعرفة.">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('maraqi-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../../style.css">
  <link rel="icon" type="image/png" href="../../logo.png">
</head>
<body>

  <div id="header-placeholder"></div>

  <main>
    <div class="container">

      <!-- مسار التنقل -->
      <nav class="breadcrumb animate-in" aria-label="مسار التنقل">
        <a href="../../index.html">الرئيسية</a>
        <span aria-hidden="true">‹</span>
        <a href="../high.html">المرحلة الثانوية</a>
        <span aria-hidden="true">‹</span>
        <span aria-current="page" id="breadcrumb-current">الحقيبة الأولى</span>
      </nav>

      <!-- عنوان الصفحة -->
      <div class="hero" style="padding-top: var(--space-8);">
        <h1 class="page-title animate-in" id="bag-title">
          الحقيبة <span>الأولى</span>
        </h1>
      </div>

      <div class="divider animate-in" aria-hidden="true">✦</div>

      <!-- شبكة الكتب — تُبنى من books.json عبر bag.js -->
      <div class="cards-grid" id="books-grid" role="list" aria-label="كتب الحقيبة" aria-live="polite">
        <div class="loading-state" style="grid-column: 1/-1;" id="loading-msg">
          <div class="loading-spinner" aria-hidden="true"></div>
          <p>جارٍ تحميل الكتب…</p>
        </div>
      </div>

    </div>
  </main>

  <footer>
    <p>برنامج مكتبة مراقي المعرفة القرائي</p>
  </footer>

  <script src="../../bag.js"></script>
  <script>
    initHeader('../..');
    initBag('books.json');
  </script>

</body>
</html>
